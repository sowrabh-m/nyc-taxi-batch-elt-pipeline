models:
  - name: stg_trips
    columns:
      - name: trip_id
        tests: [unique, not_null]
      - name: pickup_location_id
        tests: 
          - relationships:
              arguments: 
                to: ref('stg_zones')
                field: location_id
  - name: stg_zones
    columns:
      - name: location_id
        tests: [unique, not_null]